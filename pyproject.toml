[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "geospatial-file-measurement-api"
version = "1.0.0"
description = "Production-grade Geospatial File Measurement API built with FastAPI"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Aereo Geospatial Engineering Candidate" }
]
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "python-multipart>=0.0.9",
    "shapely>=2.0.0",
    "pyproj>=3.6.0",
    "pyshp>=2.3.0",
    "defusedxml>=0.7.0",
    "sqlalchemy>=2.0.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-v --strict-markers"
filterwarnings = [
    "ignore::DeprecationWarning",
]
